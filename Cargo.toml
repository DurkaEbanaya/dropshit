[package]
name = "dropshit"
version = "0.1.5"
edition = "2024"
license = "GPL-3.0-only"
description = "Terminal server selector and regional HTTPS latency monitor for Linux"

[dependencies]
crossterm = "0.29"
serde_json = "1"
ipnet = "2"
libc = "0.2"
unicode-width = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
